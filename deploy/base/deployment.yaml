apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scoring
  labels:
    app.kubernetes.io/name: fraud-scoring
    app.kubernetes.io/part-of: cauri
    cauri.io/team: risk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-scoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-scoring
        app.kubernetes.io/part-of: cauri
        cauri.io/team: risk
    spec:
      containers:
        - name: fraud-scoring
          image: ghcr.io/demo-org-np-migration/fraud-scoring:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fraud-scoring-config
            - secretRef:
                name: fraud-scoring-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
