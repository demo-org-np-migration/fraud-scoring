[project]
name = "fraud-scoring"
version = "0.1.0"
description = "Scoring de fraude para pagos de Cauri: velocidad en Redis + vendor Sentinel"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "python-jose[cryptography]>=3.3",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "fakeredis>=2.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
