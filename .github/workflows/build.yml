name: build

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/demo-org-np-migration/fraud-scoring

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha7: ${{ steps.vars.outputs.sha7 }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short sha
        id: vars
        run: echo "sha7=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.vars.outputs.sha7 }}

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Set new image tag on staging overlay
        working-directory: deploy/overlays/staging
        run: kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:sha-${{ needs.build-and-push.outputs.sha7 }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/staging/kustomization.yaml
          git commit -m "chore: staging sha-${{ needs.build-and-push.outputs.sha7 }} [skip ci]"
          git push

  deploy-prod:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Set new image tag on prod overlay
        working-directory: deploy/overlays/prod
        run: kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:sha-${{ needs.build-and-push.outputs.sha7 }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git commit -m "chore: prod sha-${{ needs.build-and-push.outputs.sha7 }} [skip ci]"
          git push
